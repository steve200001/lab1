<ion-item>
  <ion-label>
    <h2>{{ item.name }}</h2>
    <p>Category: {{ item.category }}</p>
    <p>Price: ₱{{ item.price }}</p>

    <div style="margin-top: 8px">
      @if (item.stock === 0) {
        <span
          style="
            background-color: #eb445a;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
          "
          >Out of Stock</span
        >
      } @else if (item.stock <= 5) {
        <span
          style="
            background-color: #ffc409;
            color: black;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
          "
          >Low Stock: {{ item.stock }}</span
        >
      } @else {
        <span
          style="
            background-color: #2dd36f;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
          "
          >In Stock: {{ item.stock }}</span
        >
      }
    </div>
  </ion-label>
</ion-item>
